<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elstaffly &amp; ElPulseChart Apps</title>
<meta name="description" content="Download Elstaffly and ElPulseChart on the App Store, or visit elstaffly.com and elpulsechart.com.">
<meta name="theme-color" content="#2f8fd6">
<script>document.documentElement.classList.add("js-entrance")</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=block">
<style>
:root{color-scheme:light;--ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--e-reveal:cubic-bezier(.16,1,.3,1);--e-settle:cubic-bezier(.22,1,.36,1)}
@property --u{syntax:"<length>";inherits:true;initial-value:1px}
*{box-sizing:border-box}
html,body{margin:0;background:#0b8ed2}
body{color:#fff;font-family:var(--ff);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.hero-section{position:relative;height:100dvh;min-height:100svh;overflow:hidden;isolation:isolate;font-size:min(calc(100vw / 3.9),calc(100svh / 7.7),130px);--u:.01em}
.hero-section__bg{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 60% at 50% 0%,rgba(140,225,255,.55) 0%,rgba(140,225,255,0) 60%),
  radial-gradient(80% 40% at 15% 70%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 70%),
  radial-gradient(90% 45% at 90% 85%,rgba(120,220,255,.28) 0%,rgba(120,220,255,0) 70%),
  #0b8ed2}
.hero-section__bg video{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.hero-section__bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,86,140,.22) 0%,rgba(4,86,140,0) 14%,rgba(4,86,140,0) 38%,rgba(5,90,145,.28) 58%,rgba(6,94,150,.5) 100%)}
.stage{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;max-width:calc(560*var(--u));margin:0 auto;padding:max(calc(18*var(--u)),env(safe-area-inset-top)) calc(18*var(--u)) max(calc(16*var(--u)),env(safe-area-inset-bottom))}
.vsp{flex-basis:0;min-height:calc(6*var(--u))} .vsp-a{flex-grow:1} .vsp-b{flex-grow:0}
.head{display:flex;align-items:center;justify-content:space-between;height:calc(40*var(--u));flex:none}
.logo{display:flex;align-items:center;gap:calc(9*var(--u))}
.logo img{width:calc(26*var(--u));height:calc(26*var(--u));border-radius:calc(7*var(--u));display:block}
.brand{font-size:calc(19*var(--u));font-weight:535;letter-spacing:-.004em;line-height:1;white-space:nowrap}
.cta{height:calc(36*var(--u));padding:0 calc(16*var(--u));border-radius:calc(18*var(--u));background:#fff;color:#000;font-size:calc(14*var(--u));font-weight:620;letter-spacing:-.024em;display:flex;align-items:center;box-shadow:0 1px 2px rgba(3,58,92,.10);transition:transform .18s ease,box-shadow .18s ease}
.cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(3,58,92,.20)}
.badge{position:relative;display:inline-flex;align-items:center;align-self:flex-start;height:calc(28*var(--u));border-radius:calc(14*var(--u));padding:0 calc(12*var(--u)) 0 calc(4*var(--u));gap:calc(8*var(--u));background:rgba(255,255,255,.18);backdrop-filter:blur(10px) saturate(115%);-webkit-backdrop-filter:blur(10px) saturate(115%)}
.badge::before,.app::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(155deg,rgba(112,242,255,.98) 0%,rgba(104,234,255,.95) 42%,rgba(87,218,255,.88) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.chip{height:calc(20*var(--u));padding:0 calc(9*var(--u));border-radius:calc(10*var(--u));background:#fff;color:#1591d6;font-size:calc(12*var(--u));font-weight:420;display:flex;align-items:center}
.btxt{font-size:calc(12.5*var(--u));color:rgba(255,255,255,.96);white-space:nowrap}
h1{text-shadow:0 2px 18px rgba(3,50,90,.45);margin:calc(12*var(--u)) 0 calc(14*var(--u));font-size:calc(34*var(--u));line-height:calc(36.7*var(--u));font-weight:400;letter-spacing:-.022em}
.ln{display:block;overflow:clip;overflow-clip-margin:calc(6*var(--u))} .ln-i{display:block}
.lede{margin:calc(10*var(--u)) 0 0;font-size:calc(15*var(--u));line-height:calc(21*var(--u));color:rgba(255,255,255,.95);letter-spacing:-.015em;max-width:calc(350*var(--u))}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:calc(10*var(--u));flex:none}
.app{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(6*var(--u));padding:calc(14*var(--u)) calc(10*var(--u));border-radius:calc(22*var(--u));background:rgba(10,90,160,.34);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);box-shadow:0 12px 34px rgba(3,58,92,.28);min-width:0}
.icon{width:calc(54*var(--u));height:calc(54*var(--u));border-radius:calc(13*var(--u));display:block;box-shadow:0 6px 16px rgba(3,58,92,.28)}
.name{margin:calc(2*var(--u)) 0 0;font-size:calc(16*var(--u));font-weight:560;letter-spacing:-.015em;line-height:1.1}
.kind{margin:0 0 calc(4*var(--u));font-size:calc(11*var(--u));letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.btn{width:100%;height:calc(40*var(--u));border-radius:calc(20*var(--u));font-size:calc(14*var(--u));font-weight:620;letter-spacing:-.026em;display:flex;align-items:center;justify-content:center;gap:calc(6*var(--u));white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease}
.btn svg{width:calc(15*var(--u));height:calc(15*var(--u))}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn-light{background:#fff;color:#000;box-shadow:0 1px 2px rgba(3,58,92,.10)}
.btn-light:hover{box-shadow:0 6px 18px rgba(3,58,92,.20)}
.btn-dark{background:#000;color:#fff;font-size:calc(12.5*var(--u));box-shadow:0 1px 2px rgba(0,0,0,.16)}
.btn-dark:hover{box-shadow:0 6px 18px rgba(0,0,0,.26)}
.qr{width:calc(78*var(--u));height:calc(78*var(--u));border-radius:calc(10*var(--u));background:#fff;padding:calc(4*var(--u));margin-top:calc(4*var(--u));display:block}
.scan{margin:0;font-size:calc(11*var(--u));color:rgba(255,255,255,.9)}
.partners{flex:none;margin-top:calc(14*var(--u))}
.plabel{text-shadow:0 1px 8px rgba(3,50,90,.5);font-size:calc(12.6*var(--u));letter-spacing:.0005em;color:rgba(255,255,255,.86)}
.langs{display:flex;flex-wrap:wrap;gap:calc(6*var(--u));margin-top:calc(8*var(--u))}
.langs span{background:rgba(10,90,160,.4)!important;height:calc(26*var(--u));padding:0 calc(11*var(--u));border-radius:calc(13*var(--u));display:flex;align-items:center;font-size:calc(13*var(--u));background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(150,240,255,.55)}
@keyframes ent-line{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes ent-rise{from{opacity:0;transform:translateY(var(--rise))}to{opacity:1;transform:none}}
@keyframes ent-settle{from{opacity:0;transform:translateY(calc(10*var(--u))) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .js-entrance .logo,.js-entrance .cta,.js-entrance .badge,.js-entrance .ln-i,.js-entrance .lede,.js-entrance .app,.js-entrance .plabel,.js-entrance .langs span{will-change:transform,opacity}
  .js-entrance .logo{--rise:calc(10*var(--u));animation:ent-rise .7s var(--e-settle) both}
  .js-entrance .cta{animation:ent-settle .6s var(--e-settle) .18s both}
  .js-entrance .badge{--rise:calc(12*var(--u));animation:ent-rise .6s var(--e-settle) .22s both}
  .js-entrance .ln:nth-child(1) .ln-i{animation:ent-line .95s var(--e-reveal) .34s both}
  .js-entrance .ln:nth-child(2) .ln-i{animation:ent-line .95s var(--e-reveal) .42s both}
  .js-entrance .lede{--rise:calc(12*var(--u));animation:ent-rise .7s var(--e-settle) .6s both}
  .js-entrance .app.staffly{animation:ent-settle .6s var(--e-settle) .76s both}
  .js-entrance .app.pulse{animation:ent-settle .6s var(--e-settle) .84s both}
  .js-entrance .plabel{text-shadow:0 1px 8px rgba(3,50,90,.5);--rise:calc(8*var(--u));animation:ent-rise .6s var(--e-settle) 1s both}
  .js-entrance .langs span{--rise:calc(8*var(--u));animation:ent-rise .6s var(--e-settle) both}
  .js-entrance .langs span:nth-child(1){animation-delay:1.06s}.js-entrance .langs span:nth-child(2){animation-delay:1.11s}.js-entrance .langs span:nth-child(3){animation-delay:1.16s}.js-entrance .langs span:nth-child(4){animation-delay:1.21s}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
